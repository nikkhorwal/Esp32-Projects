sentence=Minimal ESP32 WiFi, OTA, mDNS and TCP serial-log base library.
paragraph=Connects saved WiFi networks, starts ArduinoOTA with mDNS (.local hostname), mirrors Serial0 to TCP port 23, and provides temp, status and WiFi terminal commands. Access via esp32-s3-board.local:23 from any device on the network.
